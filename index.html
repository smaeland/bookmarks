<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Bookmarks</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔖</text></svg>">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link href="style.css" rel="stylesheet">
  </head>

<body>

  <div class="container">

    <nav class="navbar">
      <div class="container">
        <span class="navbar-brand h1">🔖 Bookmarks</span>
        <a class="btn btn-outline-secondary" href="https://github.com/smaeland/bookmarks">Edit <img src="https://github.githubassets.com/favicons/favicon.png" width="20" height="20" class="d-inline-block align-text-top"></a>
      </div>
    </nav>

    <div class="my-5"></div>

    <!-- Uncategorised important links --> 
    <div class="container p-2">
      <section id="important-section">
        <div id="important-grid" class="row row-cols-1 row-cols-md-3 g-2"></div>
      </section>
    </div>

    <div class="my-5"></div>
    
    <!-- Categorised links -->
    <div class="container p-2">
      <!-- <div class="accordion" id="categories-root"></div> -->
      <section id="categories-root"></section>
    </div>
    
    <!-- Alerts --> 
    <div class="container p-2">
      <div id="error" class="hidden" role="alert"></div>
    </div>

    <!-- <footer> -->
      <!-- Served as a static page. Edit bookmarks.yaml to update links. -->
    <!-- </footer> -->
  </div>

  <!-- Dependencies and app logic -->
  <script defer src="https://cdn.jsdelivr.net/npm/js-yaml@4.1.0/dist/js-yaml.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  <script defer src="app.js"></script>
</body>
</html>
